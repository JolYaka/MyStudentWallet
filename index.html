<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>MyStudentWallet</title>
  <meta name="description" content="Suivi de dépenses pour étudiants : simple, hors ligne, multi-devises.">
  <meta name="theme-color" content="#f2f3f5">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="preload" href="assets/fonts/manrope.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/app.css">
  <script>
    // Capté ici, avant tout le reste : Chrome n'envoie cet événement qu'une fois.
    window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); window.__invite = e; });
    // Thème appliqué avant l'affichage pour éviter un flash blanc en mode sombre.
    try {
      var r = JSON.parse(localStorage.getItem('msw-theme') || 'null');
      if (r === 'sombre') document.documentElement.dataset.theme = 'dark';
      if (r === 'clair') document.documentElement.dataset.theme = 'light';
    } catch (e) {}
  </script>
</head>
<body>
  <div id="app" aria-live="off"></div>
  <noscript>MyStudentWallet a besoin de JavaScript pour fonctionner.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
